name: Build Service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string
        description: "staging or production"
      image-tag:
        required: true
        type: string

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build \
            -f backend/apps/${{ inputs.service }}/Dockerfile \
            -t $ECR_REGISTRY/servicehubuae-${{ inputs.service }}:${{ inputs.image-tag }} \
            -t $ECR_REGISTRY/servicehubuae-${{ inputs.service }}:${{ inputs.environment }} \
            .
          docker push $ECR_REGISTRY/servicehubuae-${{ inputs.service }} --all-tags
