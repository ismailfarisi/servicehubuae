name: PR Check

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.3.14 regressed source-barrel circular-import
          # resolution ("Export named X not found"), which turbo cache had been
          # hiding. 1.3.13 matches the dev environment. Revisit when upstream
          # fixes it.
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx --bun @biomejs/biome@1.9.4 check --diagnostic-level=error .
        working-directory: backend

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify no legacy vendor-role references
        run: ./scripts/check-no-legacy-vendor-role.sh

      - name: Typecheck
        run: >-
          bunx turbo run typecheck
          --filter='@servicehubuae/api-gateway'
          --filter='@servicehubuae/auth-service'
          --filter='@servicehubuae/catalog-service'
          --filter='@servicehubuae/vendor-service'
          --filter='@servicehubuae/notification-service'
          --filter='@servicehubuae/cms-service'
          --filter='@servicehubuae/integration-service'
          --filter='@servicehubuae/reels-service'
          --filter='@servicehubuae/booking-service'

      # Unit tests only. Integration tests (*.integration.test.ts,
      # tests/integration/**) need live Postgres/Redis not present in CI and are
      # run separately — see backend/scripts/test-ci.sh.
      - name: Test
        run: bash backend/scripts/test-ci.sh

      - name: Build
        run: >-
          bunx turbo run build
          --filter='@servicehubuae/api-gateway'
          --filter='@servicehubuae/auth-service'
          --filter='@servicehubuae/catalog-service'
          --filter='@servicehubuae/vendor-service'
          --filter='@servicehubuae/notification-service'
          --filter='@servicehubuae/cms-service'
          --filter='@servicehubuae/integration-service'
          --filter='@servicehubuae/reels-service'
          --filter='@servicehubuae/booking-service'
